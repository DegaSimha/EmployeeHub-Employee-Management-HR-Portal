spring.config.import=optional:file:.env[.properties]
spring.application.name=employeehub
server.port=${PORT:${SERVER_PORT:8081}}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employeehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8081}
app.attendance.late-after=${ATTENDANCE_LATE_AFTER:09:15}
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.seed.admin-email=${ADMIN_EMAIL:admin@employeehub.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
app.seed.employee-password=${EMPLOYEE_PASSWORD:Employee@123}
